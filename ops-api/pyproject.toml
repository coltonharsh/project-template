[project]
name = "boilerplate-ops-api"
version = "0.0.1"
description = "Ops API — receives frontend requests and starts Temporal workflows"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "temporalio==1.5.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
